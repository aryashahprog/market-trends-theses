name: Ingest and publish

# GitHub cron is UTC. Each slot lists both its EDT and EST hour plus a late retry; the "due" step
# runs ingestion only when the latest 08:00/16:00 America/New_York slot has no successful run.
on:
  schedule:
    - cron: "5 12,13,14 * * *"
    - cron: "5 20,21,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-atlas-ingest
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SIGNAL_ATLAS_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore database from the data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then git show origin/data:signal_atlas.db > data/signal_atlas.db; fi
          python -m signal_atlas.cli seed
      - name: Is a scheduled slot due?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "due=true" >> "$GITHUB_OUTPUT"
          else python -m signal_atlas.cli due >> "$GITHUB_OUTPUT"; fi
      - name: Ingest
        if: steps.due.outputs.due == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m signal_atlas.cli ingest > ingest.json
          python -c "import json; r=json.load(open('ingest.json')); print(r['status'], [(s['source'], s['status'], s['error']) for s in r['sources']])"
      - name: Save database to the data branch
        if: steps.due.outputs.due == 'true'
        run: |
          python -c "import sqlite3; c=sqlite3.connect('data/signal_atlas.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.close()"
          mkdir -p /tmp/databranch && cp data/signal_atlas.db /tmp/databranch/ && cd /tmp/databranch
          git init -q -b data && git add signal_atlas.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Data snapshot"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Build static site
        if: steps.due.outputs.due == 'true'
        run: python -m signal_atlas.cli export --out site
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.due == 'true'
        with:
          path: site
      - id: deploy
        if: steps.due.outputs.due == 'true'
        uses: actions/deploy-pages@v4
