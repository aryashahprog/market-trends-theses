name: Ingest and publish

# GitHub cron is UTC and best-effort: scheduled runs are often hours late or dropped (here usually two of
# six fired a day, 4-6 h after the slot). So every 20 minutes for about four hours after each slot, in both
# its EDT and EST hour, a run checks the "due" step, which ingests only when the latest 08:00/16:00
# America/New_York slot has no successful run. Runs that are not due exit after the check.
on:
  schedule:
    - cron: "11,31,51 12-15 * * *"
    - cron: "11,31,51 20-23 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["signal_atlas/**", ".github/workflows/publish.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-atlas-ingest
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    env:
      SIGNAL_ATLAS_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore database from the data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then git show origin/data:signal_atlas.db > data/signal_atlas.db; fi
          python -m signal_atlas.cli seed  # seeds an empty DB, or applies editorial revisions (new snapshot for today only)
      - name: Is a scheduled slot due?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "due=true" >> "$GITHUB_OUTPUT"
          else python -m signal_atlas.cli due >> "$GITHUB_OUTPUT"; fi
      - name: Ingest
        if: steps.due.outputs.due == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m signal_atlas.cli ingest > ingest.json
          python - <<'PY'
          import json
          with open("ingest.json") as f:
              run = json.load(f)
          print(run["status"], [(s["source"], s["status"], s["error"]) for s in run["sources"]])
          if any(s["source"] == "sec_edgar" and "SEC_USER_AGENT" in (s["error"] or "") for s in run["sources"]):
              print("::warning title=SEC EDGAR not configured::Set the SEC_USER_AGENT Actions secret to a project name and contact email.")
          PY
      - name: Save database to the data branch
        if: steps.due.outputs.due == 'true' || github.event_name == 'push'
        run: |
          python -m signal_atlas.cli pack
          mkdir -p /tmp/databranch && cp data/signal_atlas.db /tmp/databranch/ && cd /tmp/databranch
          git init -q -b data && git add signal_atlas.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Data snapshot"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Build static site
        if: steps.due.outputs.due == 'true' || github.event_name == 'push'
        run: python -m signal_atlas.cli export --out site
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.due == 'true' || github.event_name == 'push'
        with:
          path: site
      # deploy-pages sometimes fails transiently right after the upload ("No artifacts named github-pages").
      # The database is already saved by then, so the slot no longer counts as due and nothing would redeploy
      # until the next slot: retry once here instead.
      - id: deploy
        if: steps.due.outputs.due == 'true' || github.event_name == 'push'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the Pages deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
