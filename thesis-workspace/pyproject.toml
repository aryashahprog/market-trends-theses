[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "pypdf>=6.4,<7",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<0.16", "mypy>=1.18,<2"]

[tool.setuptools.packages.find]
include = ["workspace"]

[tool.setuptools.package-data]
workspace = ["schema.sql", "templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
check_untyped_defs = true
